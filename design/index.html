<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Global tokens + layout -->
    <link rel="stylesheet" href="styles/base.css" />
    <!-- Component styles -->
    <link rel="stylesheet" href="components/Button/button.css" />
    <link rel="stylesheet" href="components/Dropdown/dropdown.css" />
    <link rel="stylesheet" href="components/FileDropzone/file-dropzone.css" />
    <link rel="stylesheet" href="components/StorageQuota/storage-quota.css" />
    <link rel="stylesheet" href="components/Tabs/tabs.css" />
    <link rel="stylesheet" href="components/FileCard/file-card.css" />
    <link rel="stylesheet" href="components/Modal/modal.css" />
    <link rel="stylesheet" href="components/FilePreview/file-preview.css" />
  </head>
  <body>
    <div class="app">
      <!-- ================= Sidebar ================= -->
      <aside class="sidebar" aria-label="Upload panel">
        <div class="sidebar__header">
          <div class="brand">
            <span class="brand__logo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
            </span>
            <h1 class="brand__name">File Manager</h1>
          </div>
          <span class="status-pill" id="status" role="status">Ready</span>
        </div>

        <!-- <FileDropzone /> -->
        <div id="slot-dropzone"></div>

        <div class="field">
          <span class="field__label">File Type Pre-filter</span>
          <!-- <Dropdown /> -->
          <div id="slot-type-filter"></div>
        </div>

        <!-- <Button variant="primary" /> -->
        <div id="slot-upload"></div>

        <!-- Selected files waiting for upload -->
        <div class="staged" id="staged" aria-live="polite"></div>

        <div class="sidebar__footer">
          <!-- <StorageQuota /> -->
          <div id="slot-quota"></div>
        </div>
      </aside>

      <!-- ================= Main ================= -->
      <main class="main">
        <header class="main__header">
          <div>
            <div class="main__title-row">
              <h2 class="main__title">Uploaded Files</h2>
              <span class="count-pill" id="file-count">0 files</span>
            </div>
            <p class="main__subtitle">Manage, preview, and organize your company documents and visual assets</p>
          </div>
          <!-- <Dropdown prefix="Sort by:" /> -->
          <div id="slot-sort"></div>
        </header>

        <div class="main__toolbar">
          <!-- <Tabs /> -->
          <div id="slot-tabs"></div>
          <span class="main__hint">Click any file card to preview details</span>
        </div>

        <section class="main__content" aria-label="Files">
          <!-- <FileCard /> × n -->
          <div class="file-grid" id="file-grid"></div>
        </section>
      </main>
    </div>

    <!-- Core helpers -->
    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <!-- Components -->
    <script src="components/Button/button.js"></script>
    <script src="components/Dropdown/dropdown.js"></script>
    <script src="components/FileDropzone/file-dropzone.js"></script>
    <script src="components/StorageQuota/storage-quota.js"></script>
    <script src="components/Tabs/tabs.js"></script>
    <script src="components/FileCard/file-card.js"></script>
    <script src="components/Modal/modal.js"></script>
    <script src="components/FilePreview/file-preview.js"></script>
    <!-- Demo data + page composition -->
    <script src="js/sample-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
